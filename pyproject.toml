[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "w40k-damage"
version = "0.2.0"
description = "A Warhammer 40k (w40k) mathhammer library to calculate hit, wound, success and damage distributions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Margus Niitsoo", email = "velochy@gmail.com" }]
keywords = ["warhammer", "40k", "mathhammer", "probability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy"]

[project.optional-dependencies]
parsing = ["pandas"]                 # csv_files_to_dict (Wahapedia-style CSV exports)
datasheet = ["wh40kdc"]              # auto-resolve weapons from the 40kdc bundle
dev = ["pytest", "pandas", "wh40kdc"]

[project.urls]
Homepage = "https://github.com/velochy/w40k-damage"

[tool.setuptools.packages.find]
include = ["w40k_damage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
